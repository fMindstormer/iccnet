name: pages
# The interactive page, https://fmindstormer.github.io/iccnet/: pages/build.py writes pages/dist/
# from files in the repository (no training, no LittleCMS), and GitHub Pages serves it
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pages/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/dist
      - id: deployment
        uses: actions/deploy-pages@v4
